const sndGoal = () => { tone(660, 0.12, 'triangle', 0.14); tone(880, 0.2, 'triangle', 0.14, 0.1); };

/* ---------- shot naming ---------- */

  for (let i = 2; i < turnSrc.length; i++) {

function buildFlight(rawPts) {

  const smoothW = (arr, w) => arr.map((p, i) => {
    const a = arr[Math.max(0, i - w)], b = arr[Math.min(arr.length - 1, i + w)];
    return { x: (a.x + p.x * 2 + b.x) / 4, y: (a.y + p.y * 2 + b.y) / 4 };

  for (let i = 1; i < sm.length; i++) cum.push(cum[i - 1] + Math.hypot(sm[i].x - sm[i - 1].x, sm[i].y - sm[i - 1].y));
